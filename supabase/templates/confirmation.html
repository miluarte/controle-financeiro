<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>Confirme seu e-mail</title></head>
<body style="margin:0;padding:0;background:#fafafa;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#fafafa;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
<tr><td align="center" style="padding:32px 16px;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;background:#ffffff;border:1px solid #e4e4e7;border-radius:24px;">
<tr><td style="padding:32px 32px 8px 32px;">
<img src="https://troco-finance.vercel.app/favicon_io/apple-touch-icon.png" width="48" height="48" alt="Troco" style="display:block;border:0;border-radius:12px;">

<tr><td style="padding:16px 32px 4px 32px;font-size:22px;font-weight:700;line-height:1.3;color:#09090b;">Confirme seu e-mail</td></tr>

</td></tr>
<tr><td style="padding:16px 32px 32px 32px;font-size:13px;line-height:1.5;color:#71717a;">Se não foi você, ignore este e-mail.</td></tr>

<p style="margin:16px 0 0 0;font-size:12px;color:#a1a1aa;">Troco · controle financeiro da família</p>
</td></tr>
